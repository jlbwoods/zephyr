# MFD WiFi Test Configuration

# MFD Driver (init first)
CONFIG_MFD=y
CONFIG_MFD_CYW43439=y
CONFIG_MFD_INIT_PRIORITY=70

# LED Driver
CONFIG_LED=y
CONFIG_LED_CYW43439=y

# WiFi Driver (init after MFD)
CONFIG_WIFI=y
CONFIG_WIFI_INIT_PRIORITY=85

# Networking (minimal)
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# Logging
CONFIG_LOG=y
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_MFD_LOG_LEVEL_DBG=y
